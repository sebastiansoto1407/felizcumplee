<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sorpresas</title>
<style>
  :root{
    --bgTop:#0f132a; --bgBot:#0b0e20; --ink:#f7f8ff;
    --acc:#ff7ad9; --acc-2:#7ad8ff; --acc-3:#ffd27a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial;color:var(--ink)}
  body{background:linear-gradient(180deg,var(--bgTop) 0%,var(--bgBot) 100%) fixed no-repeat}

  /* Header */
  header{
    position:fixed;inset:0 0 auto 0;z-index:20;display:flex;justify-content:space-between;align-items:center;
    padding:10px 16px; backdrop-filter:blur(8px);
    background:linear-gradient(180deg,rgba(14,18,36,.7),rgba(14,18,36,0));
    font-weight:800
  }
  header a{color:var(--ink);text-decoration:none;font-size:14px;padding:6px 12px;border:1px solid rgba(255,255,255,.22);border-radius:999px}

  /* Texto central */
  .hero{
    position:absolute;inset:0;display:flex;justify-content:center;align-items:center;flex-direction:column;z-index:2;text-align:center;padding:20px
  }
  .hero h1{
    margin:0; font-size:clamp(44px,8.5vw,96px);
    background:linear-gradient(90deg,var(--acc),var(--acc-2),var(--acc-3));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    animation:hue 10s linear infinite;
    text-shadow:0 6px 28px rgba(122,216,255,.18);
  }
  @keyframes hue{0%{filter:hue-rotate(0)}100%{filter:hue-rotate(360deg)}}

  /* Globos (mejorados) */
  .balloon{
    position:fixed; bottom:-18vh; z-index:1;
    border-radius:50% 50% 45% 45%;
    filter: drop-shadow(0 6px 16px rgba(0,0,0,.35));
    animation: rise linear forwards, sway ease-in-out infinite;
  }
  .balloon::before{ /* brillo */
    content:""; position:absolute; left:18%; top:20%; width:18%; height:26%;
    border-radius:50%; background:rgba(255,255,255,.55); filter:blur(1px);
  }
  .balloon::after {
  content: "";
  position: absolute;
  top: 100%;              /* empieza justo debajo del globo */
  left: 50%;
  transform: translateX(-50%);
  width: 2px;
  height: 22vh;           /* largo del hilo */
  background: rgba(255,255,255,.18);
}

  @keyframes rise{ to{ transform:translateY(-120vh) } }
  @keyframes sway{
    0%,100%{ margin-left:-6px } 50%{ margin-left:6px }
  }

  /* Corazones cayendo */
  .heart{
    position:fixed; top:-6vh; z-index:3; pointer-events:none;
    animation: fall linear forwards;
    will-change: transform, opacity;
  }
  @keyframes fall{
    0%{ transform:translateY(0) translateX(0) rotate(0); opacity:.95 }
    100%{ transform:translateY(115vh) translateX(var(--drift,0)) rotate(360deg); opacity:.85 }
  }

  /* Frases flotantes */
  .phrase{
    position:fixed;white-space:nowrap;font-size:20px;font-weight:700;pointer-events:none;z-index:6;
    animation: floatUp 3s ease forwards;
  }
  @keyframes floatUp{ to{ transform:translateY(-120px); opacity:0 } }

  /* Fuegos artificiales */
  #fwCanvas{position:fixed;inset:0;z-index:4;pointer-events:none}
</style>
</head>
<body>
  <canvas id="fwCanvas"></canvas>

  <header>
    <div>🎉 Edición especial</div>
    <a href="index.html">← Volver al inicio</a>
  </header>

  <div class="hero"><h1>¡Feliz Cumple! 🎂</h1></div>

<script>
/* Utilidades */
const rand=(min,max)=>Math.random()*(max-min)+min;

/* === CONFETI === */
function confettiBurst(count=70){
  const emojis=['✨','💖','🎉','🌟','🎊','💫'];
  for(let i=0;i<count;i++){
    const s=document.createElement('div');
    s.textContent=emojis[(Math.random()*emojis.length)|0];
    Object.assign(s.style,{
      position:'fixed', left:rand(5,95)+'vw', top:'-8vh', zIndex:7,
      fontSize:rand(18,32)+'px', opacity:.98,
      transition:`transform ${rand(1,2.2)}s cubic-bezier(.2,.7,.2,1), opacity .7s ease`
    });
    document.body.appendChild(s);
    requestAnimationFrame(()=>{ s.style.transform=`translateY(115vh) rotate(${rand(360,720)}deg)`; s.style.opacity=.9; });
    setTimeout(()=>s.remove(), 3200);
  }
}
setTimeout(()=>confettiBurst(90), 300);          // estallido inicial más rápido
setInterval(()=>confettiBurst(36), 3000);        // mini-confeti cada 3 s

/* === CORAZONES CONTINUOS === */
setInterval(()=>{
  const h=document.createElement('div');
  h.className='heart';
  h.textContent=Math.random()<.5?'💖':'💗';
  const size=rand(18,28);
  Object.assign(h.style,{
    left:rand(0,100)+'vw', fontSize:size+'px',
    animationDuration: rand(2.4,3.4)+'s', '--drift': rand(-40,40)+'vw'
  });
  document.body.appendChild(h);
  setTimeout(()=>h.remove(), 3600);
}, 220);

/* === GLOBOS DINÁMICOS (mejorados) === */
const colors=['#ff7ad9','#7ad8ff','#ffd27a','#c9a2ff','#8affc1'];
function spawnBalloon(){
  const b=document.createElement('div'); b.className='balloon';
  const w=rand(28,46), h=w*1.3, dur=rand(9,14), sway=rand(2.6,4.2);
  const color=colors[(Math.random()*colors.length)|0];
  Object.assign(b.style,{
    left:rand(2,98)+'vw', width:w+'px', height:h+'px',
    background:`radial-gradient(circle at 30% 30%, rgba(255,255,255,.45), transparent 60%), ${color}`,
    animationDuration:`${dur}s, ${sway}s`
  });
  document.body.appendChild(b);
  setTimeout(()=>b.remove(), (dur*1000)+500);
}
setInterval(spawnBalloon, 700);   // más globos y más seguido
for(let i=0;i<6;i++) setTimeout(spawnBalloon, i*400);

/* === FRASES AL CLIC === */
const frases=[
  "Eres única 🌷","Hoy todo es por ti ✨","Tu sonrisa lo cambia todo 💖",
  "20 y brillando más que nunca 🌟","Gracias por existir 🎁",
  "El mundo es mejor contigo 🌍","Siempre suficiente 💫","Que tus sueños vuelen alto 🚀"
];
addEventListener('click',(e)=>{
  const t=document.createElement('div'); t.className='phrase';
  t.textContent=frases[(Math.random()*frases.length)|0];
  t.style.left=(e.clientX-20)+'px'; t.style.top=(e.clientY-20)+'px';
  t.style.color=['#ff7ad9','#7ad8ff','#ffd27a','#c9a2ff'][ (Math.random()*4)|0 ];
  document.body.appendChild(t); setTimeout(()=>t.remove(),3000);
});

/* === FUEGOS ARTIFICIALES CADA 2.4 s === */
const fw=document.getElementById('fwCanvas'), ctx=fw.getContext('2d');
function resize(){ fw.width=innerWidth; fw.height=innerHeight } resize(); addEventListener('resize',resize);

function firework(){
  const particles=[], cx=rand(fw.width*0.1, fw.width*0.9), cy=rand(fw.height*0.15, fw.height*0.45);
  const palette=['#ff7ad9','#7ad8ff','#ffd27a','#c9a2ff','#8affc1'];
  const n=90;
  for(let i=0;i<n;i++){
    const a=(i/n)*Math.PI*2, s=rand(2.2,4);
    particles.push({x:cx,y:cy,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:70+rand(0,20),c:palette[(Math.random()*palette.length)|0]});
  }
  let f=0;
  (function tick(){
    ctx.clearRect(0,0,fw.width,fw.height);
    f++;
    particles.forEach(p=>{
      p.x+=p.vx; p.y+=p.vy; p.vx*=0.985; p.vy=(p.vy+0.03)*0.985; p.life--;
      ctx.globalAlpha=Math.max(p.life/90,0);
      ctx.fillStyle=p.c; ctx.beginPath(); ctx.arc(p.x,p.y,2,0,Math.PI*2); ctx.fill();
    });
    if(f<120) requestAnimationFrame(tick);
  })();
}
setInterval(firework, 2400);
</script>
</body>
</html>
