<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#091022" />
  <title>Una pequeña sorpresa 🌷</title>
  <style>
    :root {
      --bg1: #060815;
      --bg2: #0c1330;
      --bg3: #1a1843;
      --text: #f8f4ff;
      --glass: rgba(255,255,255,.08);
      --glass-border: rgba(255,255,255,.16);
      --stem1: #8abc70;
      --stem2: #547b45;
      --leaf1: #90c975;
      --leaf2: #5b854c;
      --petal1: #ffffff;
      --petal2: #ffeaf3;
      --petal3: #fcd5e8;
      --petal4: #f7a8cf;
      --gold1: #fff8d6;
      --gold2: #ffd96d;
      --wrap1: #f6e8d5;
      --wrap2: #e8d4b7;
      --wrap3: #dcc09f;
      --ribbon1: #ffb2d3;
      --ribbon2: #e17aad;
      --skin1: #f0c1a8;
      --skin2: #da9784;
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      overflow: hidden;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 50% -10%, rgba(193, 153, 255, .18), transparent 35%),
        radial-gradient(circle at 15% 15%, rgba(255, 171, 216, .12), transparent 24%),
        radial-gradient(circle at 88% 20%, rgba(255, 232, 178, .08), transparent 18%),
        linear-gradient(180deg, var(--bg3), var(--bg2) 42%, var(--bg1) 100%);
      position: relative;
      isolation: isolate;
    }

    .ambient, .stars, .particles {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }
    .ambient { z-index: -3; }
    .stars { z-index: -2; }
    .particles { z-index: -1; }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(72px);
      opacity: .34;
      animation: drift 14s ease-in-out infinite alternate;
    }
    .orb.one { width: 330px; height: 330px; left: -90px; top: -70px; background: rgba(234, 144, 199, .25); }
    .orb.two { width: 420px; height: 420px; right: -170px; top: 16%; background: rgba(149, 127, 255, .2); animation-delay: -5s; }
    .orb.three { width: 360px; height: 360px; left: 26%; bottom: -170px; background: rgba(141, 212, 162, .10); animation-delay: -8s; }
    @keyframes drift { to { transform: translate3d(40px, 28px, 0) scale(1.08); } }

    .moon {
      position: absolute;
      right: clamp(20px, 6vw, 82px);
      top: clamp(16px, 4vw, 44px);
      width: clamp(72px, 10vw, 120px);
      aspect-ratio: 1;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #fffef8, #fff4ce 56%, #ffefb2 100%);
      box-shadow: 0 0 30px rgba(255, 239, 180, .28), 0 0 110px rgba(255, 240, 186, .12);
      opacity: .95;
    }
    .moon::after {
      content: "";
      position: absolute;
      inset: 10px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 66% 34%, rgba(208, 196, 157, .16) 0 9px, transparent 10px),
        radial-gradient(circle at 42% 62%, rgba(208, 196, 157, .11) 0 13px, transparent 14px);
      opacity: .55;
    }

    .star {
      position: absolute;
      border-radius: 50%;
      background: rgba(255,255,255,.92);
      box-shadow: 0 0 10px rgba(255,255,255,.45);
      animation: twinkle 3.5s ease-in-out infinite;
    }
    @keyframes twinkle { 50% { opacity: .28; transform: scale(.75); } }

    .particle {
      position: absolute;
      bottom: -10vh;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,240,247,.95), rgba(255, 171, 216, .35));
      box-shadow: 0 0 18px rgba(255, 171, 216, .28);
      animation: rise linear infinite;
    }
    @keyframes rise {
      from { transform: translateY(0) scale(.65); opacity: 0; }
      12% { opacity: .8; }
      to { transform: translateY(-120vh) scale(1.25); opacity: 0; }
    }

    .back-btn {
      position: fixed;
      top: 18px;
      left: 18px;
      z-index: 20;
      min-height: 48px;
      padding: 0 18px;
      border-radius: 16px;
      border: 1px solid var(--glass-border);
      background: var(--glass);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      color: var(--text);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-weight: 800;
      box-shadow: 0 18px 38px rgba(0,0,0,.25);
      transition: .28s ease;
    }
    .back-btn:hover { transform: translateY(-4px); background: rgba(255,255,255,.12); }

    .scene {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 78px 16px 18px;
    }

    .bouquet-stage {
      position: relative;
      width: min(94vw, 1020px);
      aspect-ratio: 1 / 1.04;
      min-height: 480px;
      max-height: 88vh;
      animation: enter .95s cubic-bezier(.2,.8,.2,1) both;
      filter: drop-shadow(0 36px 86px rgba(0,0,0,.42));
    }
    @keyframes enter { from { opacity: 0; transform: translateY(28px) scale(.97); } to { opacity: 1; transform: none; } }

    .glow {
      position: absolute;
      left: 50%;
      bottom: 25%;
      width: 75%;
      height: 50%;
      transform: translateX(-50%);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 200, 225, .25), rgba(187, 145, 255, .1), transparent 65%);
      filter: blur(40px);
      z-index: 0;
    }

    .bouquet {
      position: absolute;
      inset: 0;
      animation: floatBouquet 6s ease-in-out infinite alternate;
    }
    @keyframes floatBouquet {
      from { transform: translateY(0px); }
      to { transform: translateY(-12px); }
    }

    .sprig {
      position: absolute;
      left: var(--x);
      bottom: 28%;
      width: var(--flowerSize);
      height: calc(var(--stemH) + var(--flowerSize) * .5);
      transform-origin: 50% 100%;
      transform: translateX(-50%) rotate(var(--angle));
      z-index: var(--z);
      animation: sway 5.8s ease-in-out infinite alternate var(--delay);
    }
    @keyframes sway {
      from { transform: translateX(-50%) rotate(calc(var(--angle) - 1.5deg)); }
      to { transform: translateX(-50%) rotate(calc(var(--angle) + 1.5deg)); }
    }

    .stem {
      position: absolute;
      left: 50%;
      top: calc(var(--flowerSize) * 0.4); /* Oculto detrás de la flor */
      bottom: 0;
      width: max(8px, calc(var(--flowerSize) * .055));
      transform: translateX(-50%);
      border-radius: 999px;
      background: linear-gradient(180deg, var(--stem1), var(--stem2));
      box-shadow: 0 0 14px rgba(146, 204, 122, .25);
      z-index: 1; /* Detrás de las hojas y la flor */
    }

    .leaf {
      position: absolute;
      width: calc(var(--flowerSize) * .48);
      height: calc(var(--flowerSize) * .18);
      background: linear-gradient(180deg, var(--leaf1), var(--leaf2));
      box-shadow: inset 0 -4px 8px rgba(0,0,0,.15);
      opacity: .96;
      z-index: 2;
    }
    .leaf.left {
      left: 50%;
      border-radius: 100% 0 100% 0;
      transform-origin: left center;
      transform: translateX(-6px) rotate(-35deg);
    }
    .leaf.right {
      left: 50%;
      border-radius: 0 100% 0 100%;
      transform-origin: right center;
      transform: translateX(-100%) rotate(35deg);
    }
    .leaf.a { bottom: 25%; }
    .leaf.b { bottom: 42%; }

    .bloom {
      position: absolute;
      left: 50%;
      top: 0;
      width: var(--flowerSize);
      height: var(--flowerSize); /* Base cuadrada para rotar mejor los pétalos */
      transform: translateX(-50%);
      animation: bloomIn 1.55s cubic-bezier(.18,.8,.2,1) both var(--delay);
      filter: drop-shadow(0 4px 18px rgba(255, 200, 225, .4));
      z-index: 3; /* Siempre por encima del tallo */
    }
    @keyframes bloomIn { from { opacity: 0; transform: translateX(-50%) scale(.72) rotate(-6deg);} to { opacity: 1; transform: translateX(-50%) scale(1) rotate(0deg);} }

    .petal {
      position: absolute;
      left: 50%;
      bottom: 45%; /* Anclado justo debajo del centro exacto */
      width: 28%;
      height: 52%;
      margin-left: -14%;
      border-radius: 50% 50% 20% 20% / 80% 80% 20% 20%; /* Forma alargada de lirio real */
      background:
        radial-gradient(ellipse at 50% 20%, rgba(255,255,255,1), rgba(255,255,255,.95) 20%, var(--petal1) 46%, var(--petal2) 74%, var(--petal3) 92%, var(--petal4) 100%);
      box-shadow: inset 0 -12px 18px rgba(239,155,198,.25), 0 0 12px rgba(255, 223, 238, .3);
      transform-origin: 50% 100%; /* Rotar desde la base del pétalo */
      animation: petalFade 1.6s ease both calc(var(--delay) + .12s);
    }
    .petal::before {
      content: "";
      position: absolute;
      left: 50%;
      bottom: 10%;
      width: 10%;
      height: 70%;
      transform: translateX(-50%);
      border-radius: 999px;
      background: linear-gradient(0deg, rgba(198, 111, 156, .4), rgba(227, 154, 191, .15), rgba(255,255,255,0));
      opacity: .85;
    }
    @keyframes petalFade { from { opacity: 0; } to { opacity: 1; } }

    /* Rotación perfecta y alineada desde el centro */
    .p1 { transform: rotate(0deg) translateY(-5%); z-index: 2;}
    .p2 { transform: rotate(60deg) translateY(-5%); z-index: 1;}
    .p3 { transform: rotate(120deg) translateY(-5%); z-index: 2;}
    .p4 { transform: rotate(180deg) translateY(-5%); z-index: 1;}
    .p5 { transform: rotate(240deg) translateY(-5%); z-index: 2;}
    .p6 { transform: rotate(300deg) translateY(-5%); z-index: 1;}

    .stamen {
      position: absolute;
      left: 50%;
      bottom: 50%; /* Nace desde el centro exacto */
      width: 3%;
      height: 24%;
      margin-left: -1.5%;
      border-radius: 999px;
      background: linear-gradient(180deg, #fff7bf, #eed45c);
      transform-origin: 50% 100%;
      z-index: 4;
      opacity: .95;
    }
    .st1 { transform: rotate(-25deg); }
    .st2 { transform: rotate(0deg); }
    .st3 { transform: rotate(25deg); }

    .center {
      position: absolute;
      left: 50%;
      top: 50%; /* Centro matemático de la flor */
      width: 16%;
      aspect-ratio: 1;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: radial-gradient(circle, var(--gold1), var(--gold2) 68%, #f0c54b 100%);
      box-shadow: 0 0 20px rgba(255, 226, 120, .6), inset 0 -2px 4px rgba(0,0,0,.15);
      z-index: 5;
      animation: pulse 2.6s ease-in-out infinite calc(var(--delay) + .9s);
    }
    @keyframes pulse { 50% { transform: translate(-50%, -50%) scale(1.1); box-shadow: 0 0 25px rgba(255, 226, 120, .8); } }

    .bud-sprig {
      position: absolute;
      left: var(--x);
      bottom: 28%;
      width: var(--budSize);
      height: calc(var(--stemH) + var(--budSize) * .5);
      transform-origin: 50% 100%;
      transform: translateX(-50%) rotate(var(--angle));
      z-index: var(--z);
      animation: swayBud 5.4s ease-in-out infinite alternate var(--delay);
    }
    @keyframes swayBud {
      from { transform: translateX(-50%) rotate(calc(var(--angle) - 1.5deg)); }
      to { transform: translateX(-50%) rotate(calc(var(--angle) + 1.5deg)); }
    }
    .bud-stem {
      position: absolute;
      left: 50%;
      top: calc(var(--budSize) * 0.3);
      bottom: 0;
      width: max(7px, calc(var(--budSize) * .08));
      transform: translateX(-50%);
      border-radius: 999px;
      background: linear-gradient(180deg, var(--stem1), var(--stem2));
      z-index: 1;
    }
    .bud-head {
      position: absolute;
      left: 50%;
      top: 0;
      width: 58%;
      height: 70%; /* Forma alargada y más realista */
      transform: translateX(-50%);
      border-radius: 50% 50% 40% 40% / 60% 60% 40% 40%;
      background: linear-gradient(180deg, #ffe7f2, #f7bfdc 62%, #ec94c6 100%);
      box-shadow: 0 0 20px rgba(255, 196, 224, .4);
      animation: budIn 1.35s cubic-bezier(.18,.8,.2,1) both var(--delay);
      z-index: 2;
    }
    @keyframes budIn { from { opacity:0; transform: translateX(-50%) scale(.8);} to { opacity:1; transform: translateX(-50%) scale(1);} }

    .wrap {
      position: absolute;
      left: 50%;
      bottom: 10%;
      width: 48%;
      height: 31%;
      transform: translateX(-50%);
      z-index: 10;
    }
    .paper {
      position: absolute;
      bottom: 0;
      border: 1px solid rgba(255,255,255,.3);
      box-shadow: 0 22px 50px rgba(0,0,0,.3);
    }
    .paper.left {
      left: 6%;
      width: 54%;
      height: 84%;
      clip-path: polygon(0 0, 100% 12%, 76% 100%, 10% 100%);
      border-radius: 20px 16px 24px 24px;
      background: linear-gradient(180deg, var(--wrap1), var(--wrap2));
      transform: rotate(-12deg);
    }
    .paper.right {
      right: 6%;
      width: 54%;
      height: 84%;
      clip-path: polygon(0 12%, 100% 0, 90% 100%, 24% 100%);
      border-radius: 16px 20px 24px 24px;
      background: linear-gradient(180deg, #fdf1e2, var(--wrap3));
      transform: rotate(12deg);
    }
    .paper.center {
      left: 50%;
      bottom: -2%;
      width: 36%;
      height: 82%;
      transform: translateX(-50%);
      clip-path: polygon(12% 0, 88% 0, 100% 100%, 0 100%);
      border-radius: 12px 12px 30px 30px;
      background: linear-gradient(180deg, #f3e2ca, #dbc2a3);
    }

    .ribbon {
      position: absolute;
      left: 50%;
      bottom: 13.2%;
      width: 20%;
      height: 10%;
      transform: translateX(-50%);
      z-index: 12;
    }
    .band {
      position: absolute;
      inset: 30% 0 auto;
      height: 34%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--ribbon2), var(--ribbon1), var(--ribbon2));
      box-shadow: 0 10px 20px rgba(225, 122, 173, .3);
    }
    .bow {
      position: absolute;
      top: 4%;
      width: 44%;
      height: 86%;
      border-radius: 100% 14% 100% 18%;
      background: linear-gradient(180deg, #ffbfdc, #ea82b3);
      box-shadow: inset 0 -8px 10px rgba(191, 68, 125, .25);
    }
    .bow.left { left: 6%; transform: rotate(-16deg); }
    .bow.right { right: 6%; transform: scaleX(-1) rotate(-16deg); }
    .knot {
      position: absolute;
      left: 50%;
      top: 26%;
      width: 18%;
      aspect-ratio: 1;
      transform: translateX(-50%);
      border-radius: 50%;
      background: linear-gradient(180deg, #ffbfdc, #df77a8);
      box-shadow: inset 0 -4px 6px rgba(178, 69, 120, .22);
      z-index: 2;
    }
    .tail {
      position: absolute;
      bottom: -32%;
      width: 16%;
      height: 68%;
      background: linear-gradient(180deg, #f59ac4, #e177a8);
      clip-path: polygon(24% 0, 100% 0, 72% 100%, 0 100%);
    }
    .tail.left { left: 33%; transform: rotate(8deg); }
    .tail.right { right: 33%; transform: scaleX(-1) rotate(8deg); }

    .hands {
      position: absolute;
      left: 50%;
      bottom: 1%;
      width: 44%;
      height: 16%;
      transform: translateX(-50%);
      z-index: 13;
      pointer-events: none;
    }
    .hand {
      position: absolute;
      bottom: 0;
      width: 40%;
      height: 74%;
      background: linear-gradient(180deg, var(--skin1), var(--skin2));
      box-shadow: inset 0 -10px 16px rgba(135, 70, 58, .2), 0 12px 20px rgba(0,0,0,.2);
      border-radius: 54% 46% 34% 42% / 58% 58% 34% 34%;
      opacity: .96;
    }
    .hand.left { left: 8%; transform: rotate(-10deg); }
    .hand.right { right: 8%; transform: scaleX(-1) rotate(-10deg); }

    .shadow {
      position: absolute;
      left: 50%;
      bottom: -15px;
      width: 72%;
      height: 9%;
      transform: translateX(-50%);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(33, 47, 78, .85), rgba(7, 13, 28, 0));
      filter: blur(20px);
      z-index: 0;
      animation: shadowPulse 6s ease-in-out infinite alternate;
    }
    @keyframes shadowPulse {
      from { transform: translateX(-50%) scale(1); opacity: 1; }
      to { transform: translateX(-50%) scale(0.9); opacity: 0.7; }
    }

    /* PLACEMENTS: Mejor distribución en abanico */
    /* Capa Trasera */
    .s1 { --x: 46%; --angle: -38deg; --stemH: 330px; --flowerSize: clamp(108px, 14vw, 160px); --z: 4; --delay: .2s; }
    .s7 { --x: 54%; --angle: 38deg; --stemH: 330px; --flowerSize: clamp(108px, 14vw, 160px); --z: 4; --delay: 1.28s; }
    /* Capa Media */
    .s2 { --x: 48%; --angle: -22deg; --stemH: 360px; --flowerSize: clamp(118px, 15vw, 170px); --z: 5; --delay: .35s; }
    .s6 { --x: 52%; --angle: 22deg; --stemH: 360px; --flowerSize: clamp(118px, 15vw, 170px); --z: 5; --delay: 1.1s; }
    /* Capa Alta */
    .s3 { --x: 49%; --angle: -10deg; --stemH: 400px; --flowerSize: clamp(130px, 17vw, 188px); --z: 6; --delay: .55s; }
    .s5 { --x: 51%; --angle: 10deg; --stemH: 400px; --flowerSize: clamp(130px, 17vw, 188px); --z: 6; --delay: .92s; }
    /* Flor Reina (Centro) */
    .s4 { --x: 50%; --angle: 0deg; --stemH: 420px; --flowerSize: clamp(142px, 18vw, 206px); --z: 7; --delay: .75s; }
    /* Capa Frontal baja */
    .s8 { --x: 48%; --angle: -15deg; --stemH: 290px; --flowerSize: clamp(100px, 13vw, 150px); --z: 8; --delay: 1.35s; }
    .s9 { --x: 52%; --angle: 15deg; --stemH: 290px; --flowerSize: clamp(100px, 13vw, 150px); --z: 8; --delay: 1.48s; }

    /* Capullos */
    .b1 { --x: 45%; --angle: -45deg; --stemH: 260px; --budSize: clamp(54px, 8vw, 76px); --z: 3; --delay: 1.1s; }
    .b2 { --x: 55%; --angle: 45deg; --stemH: 260px; --budSize: clamp(54px, 8vw, 76px); --z: 3; --delay: 1.24s; }
    .b3 { --x: 50%; --angle: 0deg; --stemH: 240px; --budSize: clamp(48px, 7vw, 68px); --z: 9; --delay: 1.36s; }

    @media (max-width: 900px) {
      .bouquet-stage { width: min(98vw, 760px); min-height: 500px; aspect-ratio: 1 / 1.18; max-height: none; }
      .back-btn { top: 14px; left: 14px; right: 14px; width: calc(100% - 28px); }
      .wrap { width: 58%; } .hands { width: 50%; } .ribbon { width: 24%; }
    }

    @media (max-width: 620px) {
      body { overflow-y: auto; }
      .scene { min-height: 100svh; padding: 76px 8px 12px; }
      .bouquet-stage { width: min(100vw, 560px); min-height: 560px; aspect-ratio: 1 / 1.38; }
      .s1, .s7 { --stemH: 250px; }
      .s2, .s6 { --stemH: 270px; }
      .s3, .s5 { --stemH: 300px; }
      .s4 { --stemH: 320px; }
      .s8, .s9 { --stemH: 220px; }
      .b1, .b2 { --stemH: 190px; }
      .b3 { --stemH: 180px; }
      .wrap { width: 76%; height: 28%; bottom: 11%; }
      .ribbon { width: 32%; bottom: 14%; }
      .hands { width: 70%; height: 14%; bottom: 3%; }
      .shadow { width: 88%; }
    }

    @media (max-width: 420px) {
      .back-btn { min-height: 44px; font-size: .94rem; border-radius: 14px; }
      .bouquet-stage { min-height: 520px; aspect-ratio: 1 / 1.46; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
    }
  </style>
</head>
<body>
  <div class="ambient">
    <div class="orb one"></div>
    <div class="orb two"></div>
    <div class="orb three"></div>
    <div class="moon"></div>
  </div>
  <div class="stars" id="stars"></div>
  <div class="particles" id="particles"></div>

  <a class="back-btn" href="regalo21.html">← Volver a nuestros recuerdos</a>

  <main class="scene">
    <div class="bouquet-stage" aria-label="Ramo de lirios hermosos">
      <div class="glow"></div>
      
      <div class="bouquet">
        <div class="sprig s1">
          <div class="bloom"><div class="petal p1"></div><div class="petal p2"></div><div class="petal p3"></div><div class="petal p4"></div><div class="petal p5"></div><div class="petal p6"></div><div class="stamen st1"></div><div class="stamen st2"></div><div class="stamen st3"></div><div class="center"></div></div>
          <div class="stem"></div><div class="leaf left a"></div><div class="leaf right b"></div>
        </div>
        <div class="sprig s2">
          <div class="bloom"><div class="petal p1"></div><div class="petal p2"></div><div class="petal p3"></div><div class="petal p4"></div><div class="petal p5"></div><div class="petal p6"></div><div class="stamen st1"></div><div class="stamen st2"></div><div class="stamen st3"></div><div class="center"></div></div>
          <div class="stem"></div><div class="leaf left b"></div><div class="leaf right a"></div>
        </div>
        <div class="sprig s3">
          <div class="bloom"><div class="petal p1"></div><div class="petal p2"></div><div class="petal p3"></div><div class="petal p4"></div><div class="petal p5"></div><div class="petal p6"></div><div class="stamen st1"></div><div class="stamen st2"></div><div class="stamen st3"></div><div class="center"></div></div>
          <div class="stem"></div><div class="leaf left a"></div><div class="leaf right b"></div>
        </div>

  <script>
    function createStars() {
      const stars = document.getElementById('stars');
      for (let i = 0; i < 90; i++) {
        const s = document.createElement('span');
        s.className = 'star';
        s.style.left = Math.random() * 100 + '%';
        s.style.top = Math.random() * 100 + '%';
        const size = 1 + Math.random() * 2.5;
        s.style.width = size + 'px';
        s.style.height = size + 'px';
        s.style.opacity = .22 + Math.random() * .76;
        s.style.animationDelay = (-Math.random() * 4) + 's';
        stars.appendChild(s);
      }
    }

    function createParticles() {
      const particles = document.getElementById('particles');
      for (let i = 0; i < 28; i++) {
        const p = document.createElement('span');
        p.className = 'particle';
        p.style.left = Math.random() * 100 + '%';
        const size = 5 + Math.random() * 10;
        p.style.width = size + 'px';
        p.style.height = size + 'px';
        p.style.opacity = .14 + Math.random() * .55;
        p.style.animationDuration = (8 + Math.random() * 10) + 's';
        p.style.animationDelay = (-Math.random() * 10) + 's';
        particles.appendChild(p);
      }
    }

    createStars();
    createParticles();
  </script>
