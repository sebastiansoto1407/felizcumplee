<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Estrellas fugaces</title>
<meta name="description" content="Atardecer mágico con auroras y estrellas fugaces">
<style>
  :root{
    --ink:#f7f8ff;
    --pink:#ff7ad9; --blue:#7ad8ff; --gold:#ffd27a; --lilac:#c9a2ff; --mint:#8affc1;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial;color:var(--ink);background:#0b0f24}

  /* ===== Escena a pantalla completa (sin cortes) ===== */
  .scene{
    position:fixed; inset:0; overflow:hidden; isolation:isolate;
    /* Fondo único animado (atardecer -> noche) sin saltos */
    background:
      radial-gradient(1600px 60% at 50% 105%, rgba(255,255,255,.06), transparent 65%) no-repeat,
      linear-gradient(180deg, #ff9475 0%, #ffd27a 28%, #6aa0ff 60%, #1a2148 85%, #0b0f24 100%) fixed;
    animation: sky 40s ease-in-out infinite alternate; /* antes 36s */
    
  }
  .fog{
  /* ...tus estilos... */
  opacity:0;
  animation: fogPhase 40s ease-in-out infinite alternate;
}
@keyframes fogPhase{
  0%   { opacity:0 }
  35%  { opacity:.10 } /* hora dorada */
  60%  { opacity:.14 } /* crepúsculo */
  100% { opacity:.08 } /* se atenúa en noche cerrada */
}

  @keyframes sky{
  /* 0% Día/atardecer temprano */
  0%{
    background:
      radial-gradient(1600px 60% at 50% 105%, rgba(255,255,255,.06), transparent 65%) no-repeat,
      linear-gradient(180deg, #ff9475 0%, #ffd27a 28%, #6aa0ff 60%, #1a2148 85%, #0b0f24 100%) fixed;
  }
  /* 40% Hora dorada (más cálida) */
  40%{
    background:
      radial-gradient(1600px 60% at 50% 105%, rgba(255,230,190,.10), transparent 65%) no-repeat,
      linear-gradient(180deg, #ff8b6a 0%, #ffc66a 30%, #5e8ef7 62%, #1a2148 90%, #0b0f24 100%) fixed;
  }
  /* 60% Crepúsculo azul (suaviza el salto) */
  60%{
    background:
      radial-gradient(1600px 60% at 50% 105%, rgba(200,215,255,.06), transparent 65%) no-repeat,
      linear-gradient(180deg, #233064 0%, #18224a 60%, #0f152f 85%, #0b0f24 100%) fixed;
  }
  /* 100% Noche */
  100%{
    background:
      radial-gradient(1600px 60% at 50% 105%, rgba(255,255,255,.04), transparent 65%) no-repeat,
      linear-gradient(180deg, #101432 0%, #0b0f24 100%) fixed;
  }
  }

  /* Vignette suave para cine */
  .scene::after{
    content:""; position:absolute; inset:-10%;
    background: radial-gradient(120% 120% at 50% 20%, transparent 60%, rgba(0,0,0,.28) 86%) ,
                radial-gradient(120% 120% at 50% 110%, transparent 60%, rgba(0,0,0,.38) 86%);
    pointer-events:none; z-index:30;
  }

  /* Header minimal con único botón */
  header{
    position:absolute; inset:0 0 auto 0; z-index:40;
    display:flex; justify-content:flex-end; padding:10px 16px;
    background:linear-gradient(180deg, rgba(6,9,20,.65), rgba(6,9,20,0));
    backdrop-filter: blur(8px); font-weight:800;
  }
  header a{
    color:var(--ink); text-decoration:none; font-size:14px;
    padding:6px 12px; border:1px solid rgba(255,255,255,.25); border-radius:999px;
  }

  /* Sol y luna (sin solapar capas) */
  .sun, .moon{
    position:absolute; left:50%; transform:translateX(-50%); border-radius:50%;
    mix-blend-mode:screen; pointer-events:none; z-index:2;
  }
  .sun{ animation: sunSet 40s cubic-bezier(.4,0,.2,1) infinite alternate; }
.moon{ animation: moonRise 40s cubic-bezier(.4,0,.2,1) infinite alternate; }

/* El sol permanece visible hasta ~45% y se desvanece */
@keyframes sunSet{
  0%   { top:20%;  opacity:1 }
  35%  { top:28%;  opacity:.95 }   /* hora dorada */
  50%  { top:60%;  opacity:.55 }   /* crepúsculo */
  60%  { top:85%;  opacity:.15 }
  100% { top:105%; opacity:0 }
}

/* La luna aparece suave desde ~45% y domina de noche */
@keyframes moonRise{
  0%   { top:115%; opacity:0 }
  40%  { top:110%; opacity:.05 }
  55%  { top:40%;  opacity:.65 }   /* asoma en crepúsculo */
  70%  { top:24%;  opacity:.9 }    /* ya es noche */
  100% { top:18%;  opacity:.95 }
}

  .sun{
    width:120px; height:120px; top:18%;
    background:radial-gradient(circle at 35% 35%, #fff6cf 0%, #ffd27a 42%, rgba(255,210,122,0) 66%);
    filter: drop-shadow(0 0 28px rgba(255,210,122,.55));
    animation: sunSet 36s ease-in-out infinite alternate;
  }
  .moon{
    width:72px; height:72px; top:110%;
    background:radial-gradient(circle at 35% 30%, #fff 0%, #f5f8ff 45%, rgba(255,255,255,0) 70%), #e9edff;
    box-shadow:0 0 22px rgba(255,255,255,.35);
    animation: moonRise 36s ease-in-out infinite alternate;
  }
  @keyframes sunSet{ 0%{ top:20%; opacity:1 } 100%{ top:105%; opacity:0 } }
  @keyframes moonRise{ 0%{ top:115%; opacity:0 } 100%{ top:18%; opacity:.95 } }

  /* Auroras sedosas (más bonitas 😍) */
  .aurora{
    position:absolute; inset:0; z-index:1; pointer-events:none;
    background:
      conic-gradient(from 180deg at 50% 70%, rgba(122,216,255,.22), rgba(201,162,255,.18), rgba(255,122,217,.18), transparent 70%) ;
    filter: blur(32px) saturate(120%);
    opacity:.0; animation: aurora 36s ease-in-out infinite alternate;
    mask-image: radial-gradient(80% 60% at 50% 65%, #000 60%, transparent 80%);
  }
  @keyframes aurora{ 0%{opacity:.0; transform:translateY(10px)} 100%{opacity:.55; transform:translateY(-6px)} }

  /* Nubes suaves en parallax, sin cortes */
  .cloud{
    position:absolute; top:12vh; left:-40vw; width:70vw; height:20vh; z-index:2; opacity:.22;
    background:
      radial-gradient(44vh 20vh at 10% 60%, rgba(255,255,255,.45), transparent 60%),
      radial-gradient(30vh 16vh at 35% 50%, rgba(255,255,255,.38), transparent 60%),
      radial-gradient(36vh 18vh at 60% 60%, rgba(255,255,255,.35), transparent 60%),
      radial-gradient(26vh 14vh at 85% 55%, rgba(255,255,255,.3),  transparent 60%);
    filter: blur(6px);
    animation: drift 120s linear infinite;
  }
  .c2{ top:22vh; opacity:.16; animation-duration:140s; transform:scale(1.2) }
  .c3{ top:8vh;  opacity:.18; animation-duration:160s; transform:scale(1.6) }
  @keyframes drift{ to{ transform: translateX(180vw) } }

  /* Montañas (3 capas parallax) + niebla */
  .mount{ position:absolute; bottom:-2vh; left:0; right:0; height:38vh; pointer-events:none }
  .m1{ z-index:3; background: radial-gradient(60vh 30vh at 15% 100%, #0a0e1f 60%, transparent 61%) bottom left/40% 100% no-repeat,
                                radial-gradient(70vh 32vh at 55% 100%, #0a0e1f 60%, transparent 61%) bottom center/52% 100% no-repeat,
                                radial-gradient(55vh 28vh at 90% 100%, #0a0e1f 60%, transparent 61%) bottom right/38% 100% no-repeat; }
  .m2{ z-index:2; filter:blur(1px); opacity:.85; transform:translateY(12px);
       background: radial-gradient(56vh 28vh at 20% 100%, #091126 60%, transparent 61%) bottom left/38% 100% no-repeat,
                   radial-gradient(66vh 30vh at 58% 100%, #091126 60%, transparent 61%) bottom center/50% 100% no-repeat,
                   radial-gradient(50vh 26vh at 88% 100%, #091126 60%, transparent 61%) bottom right/36% 100% no-repeat; }
  .fog{
    position:absolute; left:0; right:0; bottom:20vh; height:26vh; z-index:4; pointer-events:none;
    background: radial-gradient(60% 80% at 50% 100%, rgba(255,255,255,.08), transparent 70%);
    filter: blur(10px);
  }
/* Estrellas: invisibles de día, máximas de noche */
#bgStars{
  opacity:0;
  animation: starsFade 40s ease-in-out infinite alternate;
}
@keyframes starsFade{
  0%   { opacity:0 }
  35%  { opacity:0 }    /* aún día */
  50%  { opacity:.35 }  /* crepúsculo */
  65%  { opacity:.75 }
  100% { opacity:.9 }
}
.cloud{
  /* ...tus estilos... */
  animation: drift 120s linear infinite, cloudsTint 40s ease-in-out infinite alternate;
}
.c2{ animation-duration:140s, 40s; }
.c3{ animation-duration:160s, 40s; }

@keyframes cloudsTint{
  0%   { opacity:.22; filter: blur(6px) }
  45%  { opacity:.20 }
  60%  { opacity:.16 }   /* noche empieza: menos densas */
  100% { opacity:.12 }
}

/* Aurora: solo crece en noche, bajita en crepúsculo para que no “corte” */
.aurora{
  opacity:0;
  animation: auroraPhase 40s ease-in-out infinite alternate;
  filter: blur(32px) saturate(120%);
}
@keyframes auroraPhase{
  0%   { opacity:0; transform:translateY(8px) }
  45%  { opacity:0; transform:translateY(6px) }   /* no aparece de día */
  60%  { opacity:.18; transform:translateY(0) }   /* tímida en crepúsculo */
  100% { opacity:.55; transform:translateY(-6px) }/* plena en noche */
}

  /* Textito */
  .caption{
    position:absolute; bottom:12px; left:50%; transform:translateX(-50%); z-index:35;
    font-size:12.5px; letter-spacing:.4px; color:rgba(255,255,255,.88);
    text-shadow:0 2px 8px rgba(0,0,0,.35);
  }

  /* Capas de estrellas/meteoros en canvas (sin cortes) */
  canvas{ position:absolute; inset:0; width:100%; height:100%; pointer-events:none }
  #bgStars{ z-index:0 }     /* estrellas fijas titilando */
  #meteors{ z-index:5 }     /* fugaces por encima */

  /* Spark de “deseo pedido” */
  .spark{
    position:absolute; z-index:50; font-size:14px; pointer-events:none; white-space:nowrap;
    animation: float 1.8s ease forwards;
    background:linear-gradient(90deg,var(--pink),var(--blue),var(--gold));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    text-shadow:0 0 18px rgba(255,255,255,.25);
  }
  @keyframes float{ to{ transform: translateY(-40px); opacity:0 } }
</style>
</head>
<body>
  <div class="scene" id="scene">
    <!-- Cielos y capas -->
    <canvas id="bgStars"></canvas>
    <div class="aurora"></div>

    <div class="sun" aria-hidden="true"></div>
    <div class="moon" aria-hidden="true"></div>

    <div class="cloud c1" aria-hidden="true"></div>
    <div class="cloud c2" aria-hidden="true"></div>
    <div class="cloud c3" aria-hidden="true"></div>

    <div class="mount m2" aria-hidden="true"></div>
    <div class="mount m1" aria-hidden="true"></div>
    <div class="fog" aria-hidden="true"></div>

    <canvas id="meteors"></canvas>

    <header><a href="index.html">← Volver al inicio</a></header>
    <div class="caption">Haz clic para pedir un deseo ✨</div>
  </div>

<script>
/* ===== Utilidades ===== */
const DPR = Math.min(window.devicePixelRatio || 1, 2); // limita para no saturar móviles
const resizeCanvas = (cv)=>{
  cv.width = Math.floor(cv.clientWidth * DPR);
  cv.height = Math.floor(cv.clientHeight * DPR);
};

/* ===== Estrellas de fondo (titilar) ===== */
const bg = document.getElementById('bgStars');
const g = bg.getContext('2d');
function initStars(){
  resizeCanvas(bg);
  const W = bg.width, H = bg.height;
  const N = Math.floor((W*H)/25000); // densidad
  const stars = [];
  for(let i=0;i<N;i++){
    stars.push({
      x: Math.random()*W,
      y: Math.random()*H*0.9,
      r: Math.random()*1.8 + 0.4,
      a: Math.random(),
      s: Math.random()*0.02 + 0.005
    });
  }
  function loop(){
    g.clearRect(0,0,W,H);
    g.globalCompositeOperation = 'lighter';
    for(const s of stars){
      s.a += s.s;
      const tw = (Math.sin(s.a)+1)/2; // twinkle 0..1
      g.globalAlpha = 0.4 + tw*0.6;
      g.fillStyle = '#fff';
      g.beginPath(); g.arc(s.x, s.y, s.r*DPR, 0, Math.PI*2); g.fill();
    }
    requestAnimationFrame(loop);
  }
  loop();
}
initStars();
addEventListener('resize', ()=>initStars(), {passive:true});

/* ===== Estrellas fugaces (meteoros con cola y brillo) ===== */
const mcv = document.getElementById('meteors');
const mctx = mcv.getContext('2d');
const palette = ['#ff7ad9','#7ad8ff','#ffd27a','#c9a2ff','#8affc1'];

class Meteor {
  constructor(){
    resizeCanvas(mcv);
    const W = mcv.width, H = mcv.height;
    const side = Math.random() < 0.5;
    const yStart = Math.random()*H*0.55 + H*0.05;
    this.x = side ? -80*DPR : W+80*DPR;
    this.y = yStart;
    const speed = (6 + Math.random()*6) * DPR;
    const angle = side ? (Math.PI/4)* (0.68+Math.random()*0.64)
                       : (Math.PI - (Math.PI/4)*(0.68+Math.random()*0.64));
    this.vx = Math.cos(angle)*speed;
    this.vy = Math.sin(angle)*speed;
    this.life = 0; this.max = 70 + Math.random()*40;
    this.len = (160 + Math.random()*140) * DPR;
    this.color = palette[(Math.random()*palette.length)|0];
  }
  step(W,H){
    this.x += this.vx; this.y += this.vy; this.life++;
    return this.life < this.max && this.x>-200*DPR && this.x<W+200*DPR && this.y>-200*DPR && this.y<H+200*DPR;
  }
  draw(){
    const t = this.life/this.max;
    const alpha = 1 - t;
    const dx = -this.vx * (this.len/24);
    const dy = -this.vy * (this.len/24);
    const grad = mctx.createLinearGradient(this.x+dx, this.y+dy, this.x, this.y);
    grad.addColorStop(0, this.color + '00');
    grad.addColorStop(.35, this.color + '55');
    grad.addColorStop(1, this.color);

    mctx.save();
    mctx.globalCompositeOperation='lighter';
    mctx.lineWidth = 2.2*DPR;
    mctx.strokeStyle = grad;
    mctx.shadowColor = this.color;
    mctx.shadowBlur = 12*DPR;
    mctx.beginPath(); mctx.moveTo(this.x+dx, this.y+dy); mctx.lineTo(this.x, this.y); mctx.stroke();

    mctx.globalAlpha = alpha;
    mctx.fillStyle=this.color;
    mctx.shadowBlur = 18*DPR;
    mctx.beginPath(); mctx.arc(this.x, this.y, 2.2*DPR, 0, Math.PI*2); mctx.fill();
    mctx.restore();
  }
}
let meteors=[];
function meteorLoop(){
  resizeCanvas(mcv);
  const W=mcv.width, H=mcv.height;
  mctx.clearRect(0,0,W,H);
  if(Math.random() < 0.16) meteors.push(new Meteor()); // más frecuencia = más “wow”
  meteors = meteors.filter(m => { m.draw(); return m.step(W,H); });
  requestAnimationFrame(meteorLoop);
}
meteorLoop();

/* ===== Confeti suave al entrar ===== */
function confettiBurst(n=30){
  const emojis=['✨','💖','🌟'];
  for(let i=0;i<n;i++){
    const s=document.createElement('div');
    s.textContent=emojis[(Math.random()*emojis.length)|0];
    Object.assign(s.style,{
      position:'absolute', left:(Math.random()*100)+'vw', top:'-8vh',
      fontSize:(16+Math.random()*12)+'px', zIndex:50, opacity:.98,
      transition:`transform ${1.2+Math.random()*1.2}s cubic-bezier(.2,.7,.2,1), opacity .6s ease`
    });
    document.getElementById('scene').appendChild(s);
    requestAnimationFrame(()=>{ s.style.transform=`translateY(110vh) rotate(${360+Math.random()*360}deg)`; s.style.opacity=.9; });
    setTimeout(()=>s.remove(),2400);
  }
}
setTimeout(()=>confettiBurst(34), 600);

/* ===== Deseo al clic ===== */
addEventListener('click', (e)=>{
  const s=document.createElement('div');
  s.className='spark';
  s.textContent='★ Deseo pedido';
  s.style.left=(e.clientX-30)+'px';
  s.style.top=(e.clientY-14)+'px';
  document.getElementById('scene').appendChild(s);
  setTimeout(()=>s.remove(), 1800);
}, {passive:true});
</script>
</body>
</html>
