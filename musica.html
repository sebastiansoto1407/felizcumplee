<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Frases musicales</title>
<meta name="description" content="Canciones con frases y enlaces a YouTube y Spotify">
<style>
  :root{
    --bgTop:#0f132a; --bgBot:#0b0e20;
    --ink:#f7f8ff; --muted:#b9c0ff;
    --border:rgba(255,255,255,.12);
    --acc:#ff7ad9; --acc-2:#7ad8ff;
    --glow:0 12px 32px rgba(122,216,255,.18);
    --radius:16px; --max:1060px;
  }
  *{box-sizing:border-box; min-width:0}
  html,body{height:100%}
  body{
    margin:0; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
    color:var(--ink);
    background: linear-gradient(180deg, var(--bgTop) 0%, var(--bgBot) 100%) fixed no-repeat;
    overflow-x:hidden; -webkit-text-size-adjust:100%;
  }
  a{color:inherit; text-decoration:none}
  .container{width:100%; max-width:var(--max); margin:0 auto; padding:0 18px}

  /* Estrellitas suaves */
  .stars{
    position:fixed; inset:0; pointer-events:none; z-index:0; opacity:.4;
    background-image:
      radial-gradient(2px 2px at 20% 30%, rgba(255,255,255,.33) 40%, transparent 41%),
      radial-gradient(2px 2px at 80% 20%, rgba(255,255,255,.26) 40%, transparent 41%),
      radial-gradient(2px 2px at 60% 80%, rgba(255,255,255,.22) 40%, transparent 41%),
      radial-gradient(1.6px 1.6px at 30% 70%, rgba(255,255,255,.20) 40%, transparent 41%),
      radial-gradient(1.6px 1.6px at 70% 60%, rgba(255,255,255,.20) 40%, transparent 41%);
    animation: twinkle 9s linear infinite;
  }
  @keyframes twinkle{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

  /* Header */
  header{
    position:sticky; top:0; z-index:10;
    backdrop-filter: blur(10px);
    background: linear-gradient(180deg, rgba(14,18,36,.6), rgba(14,18,36,0));
  }
  .nav{display:flex;align-items:center;justify-content:space-between;height:60px;gap:8px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:14px}
  .badge{font-size:11px;padding:6px 10px;border-radius:999px;background:linear-gradient(90deg,var(--acc),var(--acc-2));color:#101225}
  .tagrow{display:flex;gap:8px;flex-wrap:wrap}
  .tag{background:rgba(255,255,255,.06);border:1px solid var(--border);padding:6px 10px;border-radius:999px;font-size:12px;color:#dfe3ff}

  /* Hero */
  .hero{text-align:center;padding: clamp(52px,9vw,110px) 0 18px}
  .hero h1{margin:0;font-size: clamp(28px, 6vw, 54px)}
  .sub{margin:10px auto 0;color:var(--muted);max-width:760px;font-size:clamp(14px,1.6vw,18px)}

  /* Grilla de canciones */
  section{padding:28px 0}
  .grid{
    display:grid; gap:14px;
    grid-template-columns:1fr;               /* móvil */
  }
  @media(min-width:560px){ .grid{ grid-template-columns:repeat(2,1fr) } }
  @media(min-width:900px){ .grid{ grid-template-columns:repeat(3,1fr) } }

  .song{
    background: linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.03));
    border:1px solid var(--border);
    border-radius:16px; padding:16px;
    display:grid; gap:10px;
    transition: transform .15s ease, border-color .2s ease, box-shadow .2s ease;
  }
  .song:hover{ transform: translateY(-4px); border-color: rgba(255,255,255,.22); box-shadow: var(--glow) }

  .title{ display:flex; gap:12px; align-items:center; }
  .icon{
    width:28px; height:28px; border-radius:10px; flex:0 0 28px;
    background:linear-gradient(90deg,var(--acc-2),var(--acc));
    display:grid; place-items:center; color:#0f1226; font-weight:900; font-size:14px;
  }
  .meta{ line-height:1.25 }
  .track{ font-weight:900 }
  .artist{ color:#cfd5ff; font-size:13px }

  /* Enlaces */
  .link{
    display:flex; align-items:center; gap:10px;
    background: rgba(255,255,255,.06);
    border:1px solid var(--border);
    border-radius:12px; padding:10px 12px;
    font-weight:800; font-size:14px; color:#eef2ff;
    word-break: break-word;
    transition: border-color .2s ease, transform .12s ease;
  }
  .link:hover{ border-color: rgba(255,255,255,.22); transform: translateY(-1px) }
  .yt::before{ content:"▶"; background:#fff; color:#111; width:18px; height:18px; display:grid; place-items:center; border-radius:4px; font-size:12px }
  .sp::before{ content:"🎧"; }

  /* Frase / verso */
  .quote{
    background:
      radial-gradient(120% 120% at 10% 10%, rgba(122,216,255,.10), transparent 70%),
      radial-gradient(120% 120% at 90% 0%, rgba(255,122,217,.10), transparent 70%),
      rgba(180,160,255,.12);
    border:1px solid rgba(255,255,255,.10);
    border-radius:12px;
    padding:12px 14px;
    color:#eaf0ff; line-height:1.6; font-size:14.8px;
    box-shadow: inset 0 -1px 0 rgba(255,255,255,.06);
  }
/* ===== Playlist embed ===== */
#playlist{ padding: 8px 0 32px; }
.playlist-card{
  background: linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.03));
  border:1px solid var(--border);
  border-radius:16px; padding:16px;
  transition: transform .15s ease, border-color .2s ease, box-shadow .2s ease;
}
.playlist-card:hover{ transform:translateY(-3px); border-color:rgba(255,255,255,.22); box-shadow:var(--glow) }

.playlist-head{ display:grid; gap:6px; margin-bottom:10px }
.playlist-title{ margin:0; font-size: clamp(20px, 3vw, 26px) }
.playlist-sub{ margin:0; color:var(--muted); font-size:14px }
.pill{
  background:linear-gradient(90deg,var(--acc-2),var(--acc));
  color:#0f1226; border-radius:999px; padding:6px 10px; font-size:12px; font-weight:900; letter-spacing:.3px;
  display:inline-block;
}

.embed-wrap{
  position:relative; width:100%;
  /* relación 16:9 (puedes subir a 80% si quieres más alto) */
  padding-top: 56.25%;
  border-radius:12px; overflow:hidden;
  border:1px solid rgba(255,255,255,.1);
  background:rgba(255,255,255,.04);
}
.embed-wrap iframe{
  position:absolute; inset:0; width:100%; height:100%; border:0;
  filter: drop-shadow(0 10px 22px rgba(0,0,0,.25));
}

.hint{ color:#cfd5ff; opacity:.9; font-size:12.5px; margin-top:10px }

  /* Reveal */
  .reveal{opacity:0;transform:translateY(14px);transition:opacity .6s ease,transform .6s ease}
  .reveal.in{opacity:1;transform:translateY(0)}

  footer{padding:36px 0 60px;color:#cdd3ff;opacity:.85}
  @media(max-width:380px){ .container{padding:0 14px} .song{padding:14px} .quote{padding:10px 12px} }
</style>
</head>
<body>
  <div class="stars" aria-hidden="true"></div>

  <header>
    <div class="container nav">
      <div class="brand">
        <span class="badge">Edición especial</span>
        <span>Frases musicales 🎶</span>
      </div>
      <nav class="tagrow" aria-label="Secciones">
        <a class="tag" href="index.html">← Inicio</a>
      </nav>
    </div>
  </header>

  <section class="hero">
    <div class="container">
      <h1>Canciones solo para ti.</h1>
      </div>
  </section>

  
  </section>
<!-- ====== Apartado: Tu playlist completa de Spotify ====== -->
<section id="playlist">
  <div class="container">
    <div class="playlist-card reveal">
      <div class="playlist-head">
        <div class="pill">Spotify</div>
        <h2 class="playlist-title"></h2>
        <p class="playlist-sub"></p>
      </div>

      <!-- Contenedor responsive 16:9 -->
      <div class="embed-wrap">
        <iframe id="spotifyEmbed" loading="lazy" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"></iframe>
      </div>

      <p class="hint">Dato: sufri exportando esto a la pagina web jaja <code></code>  <code></code></p>
    </div>
  </div>
</section>

  <footer>
    <div class="container">Hecho con 💖 </div>
  </footer>

<script>
/* Reveal on Scroll */
const io = new IntersectionObserver((entries)=>{
  entries.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target);} })
},{threshold:.12});
document.querySelectorAll('.reveal').forEach(el=>io.observe(el));
const PLAYLIST_URL = "https://open.spotify.com/playlist/3jWqymxMKGY09f1EcxmiLz?si=f259bf038068402e"; // <- pega tu link aquí

function toSpotifyEmbed(url){
  try{
    const u = new URL(url);
    // convierte /playlist/X a /embed/playlist/X (también album, artist, track, show, episode)
    u.pathname = "/embed" + u.pathname;
    // limpia query para un embed más limpio
    u.search = "";
    return u.toString();
  }catch(e){
    return null;
  }
}

(function initSpotify(){
  const iframe = document.getElementById("spotifyEmbed");
  const embed = toSpotifyEmbed(PLAYLIST_URL);
  if(embed){ iframe.src = embed; }
  else {
    // fallback visual simple
    iframe.outerHTML = '<div class="hint" style="padding:10px 0">⚠️ Link de Spotify inválido. Revisa el valor de <code>PLAYLIST_URL</code>.</div>';
  }
})();

</script>
</body>
</html>
