<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WhatsApp Screenshots</title>
  <meta name="description" content="Capturas de pantalla de WhatsApp — Momentos especiales">
  <style>
    :root {
      --bgTop: #0f132a;
      --bgBot: #0b0e20;
      --ink: #f7f8ff;
      --muted: #b9c0ff;
      --border: rgba(255, 255, 255, .12);
      --acc: #ff7ad9;
      --glow: 0 12px 32px rgba(122, 216, 255, .18);
      --radius: 16px;
      --max: 1060px;
    }

    * {
      box-sizing: border-box;
      min-width: 0;
    }

    html, body {
      margin: 0;
      height: 100%;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
      background: linear-gradient(180deg, var(--bgTop) 0%, var(--bgBot) 100%) fixed;
      color: var(--ink);
      overflow-x: hidden;
    }

    /* Galería de capturas */
    .container {
      max-width: var(--max);
      margin: 0 auto;
      padding: 18px;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 18px;
    }

    .photo-card {
      background: linear-gradient(180deg, rgba(255, 255, 255, .05), rgba(255, 255, 255, .03));
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      transition: transform .15s ease, box-shadow .2s ease;
      height: 500px;  /* Mayor altura */
    }

    .photo-card img {
      width: 100%;
      height: 100%;  /* Las imágenes ocupan todo el espacio disponible */
      object-fit: cover;
    }

    .photo-card:hover {
      transform: translateY(-6px);  /* Efecto hover más marcado */
      box-shadow: var(--glow);
    }

    /* Responsive */
    @media (min-width: 560px) {
      .gallery-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (min-width: 900px) {
      .gallery-grid {
        grid-template-columns: repeat(3, 1fr); /* Tres columnas para pantallas grandes */
      }
    }

    /* Botón de Volver al Inicio */
    .back-to-top {
      position: fixed;
      top: 10px;
      left: 10px;
      padding: 10px 20px;
      background-color: var(--acc);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      box-shadow: var(--glow);
      transition: transform 0.3s ease;
    }

    .back-to-top:hover {
      transform: scale(1.1);
    }

  </style>
</head>
<body>
  <div class="container">
