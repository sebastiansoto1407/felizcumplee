<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2d2118" />
  <title>La cajita de las notitas ✉️</title>

  <style>
    :root{
      --ink:#3e332b;
      --ink-soft:#6e6157;
      --cream:#f4efe5;
      --cream-2:#e8dfd0;

      --wood-dark:#4a2f1f;
      --wood:#6b452d;
      --wood-mid:#7b5136;
      --wood-light:#936345;
      --wood-highlight:#ad7957;

      --box-dark:#4d2f1e;
      --box:#775037;
      --box-light:#9a6c4d;
      --metal:#8e8376;

      --paper-1:#f8f0cf;
      --paper-2:#efe5c2;
      --paper-3:#e8efe0;
      --paper-4:#e7edf0;
      --paper-5:#f1e7d7;

      --shadow:0 28px 65px rgba(31,18,10,.34);
      --soft-shadow:0 15px 32px rgba(38,22,13,.22);
    }

    *{box-sizing:border-box}
    html{scroll-behavior:smooth}

    body{
      margin:0;
      min-height:100vh;
      overflow-x:hidden;
      font-family:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color:var(--ink);
      background:#211914;
    }

    button,a{font:inherit}
    button{cursor:pointer}

    /* =========================================================
       ROOM / TABLE SCENE
    ========================================================= */

    .room{
      position:relative;
      min-height:100vh;
      overflow:hidden;
      background:
        radial-gradient(circle at 23% 14%, rgba(255,244,210,.22), transparent 18%),
        linear-gradient(180deg,#373127 0 27%,#2b251f 27% 30%,transparent 30%);
      isolation:isolate;
    }

    .wall{
      position:absolute;
      inset:0 0 60% 0;
      background:
        linear-gradient(90deg,rgba(255,255,255,.018),transparent 25%,rgba(255,255,255,.012) 65%,transparent),
        linear-gradient(180deg,#4a4337,#393229);
      z-index:-5;
    }

    .wall::after{
      content:"";
      position:absolute;
      left:0;right:0;bottom:0;
      height:12px;
      background:linear-gradient(180deg,#251c16,#34271e);
      box-shadow:0 -3px 10px rgba(0,0,0,.2);
    }

    .window-light{
      position:absolute;
      left:-4%;
      top:-4%;
      width:46vw;
      height:52vh;
      transform:skewX(-10deg);
      background:linear-gradient(140deg,rgba(255,242,198,.26),rgba(255,242,198,.06) 55%,transparent 72%);
      filter:blur(4px);
      pointer-events:none;
      z-index:-3;
    }

    .window-bars{
      position:absolute;
      left:2%;
      top:2%;
      width:26vw;
      height:25vh;
      opacity:.12;
      transform:skewX(-10deg);
      background:
        linear-gradient(90deg,transparent 47%,#19130f 48% 52%,transparent 53%),
        linear-gradient(180deg,transparent 47%,#19130f 48% 52%,transparent 53%);
      filter:blur(1px);
      z-index:-2;
    }

    .table{
      position:relative;
      min-height:100vh;
      padding:88px 18px 34px;
      background:
        linear-gradient(180deg,transparent 0 29%,rgba(30,20,13,.08) 29.2%),
        repeating-linear-gradient(
          4deg,
          transparent 0 74px,
          rgba(48,24,12,.12) 75px 77px,
          transparent 78px 145px
        ),
        repeating-linear-gradient(
          90deg,
          rgba(255,255,255,.015) 0 2px,
          transparent 2px 118px
        ),
        linear-gradient(155deg,var(--wood-highlight),var(--wood-mid) 28%,var(--wood) 64%,var(--wood-dark));
      box-shadow:inset 0 28px 60px rgba(0,0,0,.16);
    }

    .table::before{
      content:"";
      position:absolute;
      left:0;right:0;top:29%;
      height:2px;
      background:rgba(49,25,13,.2);
      box-shadow:0 2px 7px rgba(0,0,0,.18);
    }

    .table::after{
      content:"";
      position:absolute;
      inset:0;
      pointer-events:none;
      background:
        radial-gradient(circle at 50% 54%,transparent 0 38%,rgba(27,16,10,.06) 68%,rgba(18,11,7,.2) 100%);
      mix-blend-mode:multiply;
    }

    /* =========================================================
       NAV
    ========================================================= */

    .back-btn{
      position:fixed;
      top:16px;
      left:16px;
      z-index:50;
      min-height:46px;
      padding:0 16px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      text-decoration:none;
      color:#f8f0e6;
      background:rgba(40,31,25,.68);
      border:1px solid rgba(255,255,255,.12);
      border-radius:12px;
      backdrop-filter:blur(12px);
      -webkit-backdrop-filter:blur(12px);
      box-shadow:0 10px 28px rgba(0,0,0,.2);
      font-weight:800;
      transition:.25s ease;
    }

    .back-btn:hover{
      transform:translateY(-3px);
      background:rgba(40,31,25,.82);
    }

    /* =========================================================
       HEADER
    ========================================================= */

    .header{
      position:relative;
      z-index:8;
      width:min(760px,92vw);
      margin:0 auto 26px;
      text-align:center;
      color:#f9f2e9;
      text-shadow:0 2px 12px rgba(0,0,0,.2);
    }

    .header .kicker{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:8px 12px;
      border-radius:999px;
      background:rgba(37,28,22,.45);
      border:1px solid rgba(255,255,255,.11);
      font-size:12px;
      font-weight:900;
      letter-spacing:.08em;
      text-transform:uppercase;
    }

    .header h1{
      margin:14px 0 8px;
      font-family:Georgia,"Times New Roman",serif;
      font-size:clamp(34px,5vw,62px);
      font-weight:600;
      letter-spacing:-.04em;
    }

    .header p{
      margin:0 auto;
      max-width:590px;
      color:rgba(255,248,239,.82);
      line-height:1.7;
      font-size:clamp(14px,1.8vw,17px);
    }

    .counter{
      display:inline-flex;
      gap:8px;
      align-items:center;
      margin-top:13px;
      padding:7px 11px;
      border-radius:999px;
      background:rgba(31,24,19,.42);
      border:1px solid rgba(255,255,255,.09);
      font-size:12px;
      font-weight:800;
      color:rgba(255,248,239,.86);
    }

    /* =========================================================
       DESK COMPOSITION
    ========================================================= */

    .desk{
      position:relative;
      z-index:5;
      width:min(1100px,96vw);
      height:650px;
      margin:0 auto;
    }

    .desk::before{
      content:"";
      position:absolute;
      left:50%;
      top:52%;
      width:58%;
      height:22%;
      transform:translate(-50%,-50%);
      border-radius:50%;
      background:rgba(31,16,8,.17);
      filter:blur(24px);
      z-index:0;
    }

    /* =========================================================
       WOODEN BOX
    ========================================================= */

    .box-wrap{
      position:absolute;
      left:50%;
      top:52%;
      width:470px;
      height:320px;
      transform:translate(-50%,-50%);
      z-index:8;
      perspective:900px;
    }

    .box-floor-shadow{
      position:absolute;
      left:50%;
      bottom:12px;
      width:78%;
      height:42px;
      transform:translateX(-50%);
      border-radius:50%;
      background:rgba(33,16,8,.35);
      filter:blur(14px);
    }

    .box-body{
      position:absolute;
      left:50%;
      bottom:34px;
      width:78%;
      height:175px;
      transform:translateX(-50%);
      border-radius:14px 14px 24px 24px;
      background:
        repeating-linear-gradient(
          7deg,
          rgba(255,255,255,.025) 0 10px,
          rgba(58,27,14,.045) 11px 13px,
          transparent 14px 28px
        ),
        linear-gradient(145deg,var(--box-light),var(--box) 55%,var(--box-dark));
      border:3px solid rgba(62,31,16,.34);
      box-shadow:
        inset 0 7px 13px rgba(255,255,255,.08),
        inset 0 -12px 18px rgba(48,22,10,.25),
        0 22px 34px rgba(39,19,9,.28);
    }

    .box-body::before,
    .box-body::after{
      content:"";
      position:absolute;
      width:10px;
      height:10px;
      border-radius:50%;
      top:50%;
      background:radial-gradient(circle at 35% 35%,#afa497,#71685e);
      box-shadow:inset 0 -2px 3px rgba(0,0,0,.25);
    }

    .box-body::before{left:20px}
    .box-body::after{right:20px}

    .label-plate{
      position:absolute;
      left:50%;
      top:50%;
      transform:translate(-50%,-50%);
      min-width:120px;
      padding:9px 16px;
      text-align:center;
      border-radius:6px;
      background:linear-gradient(180deg,#a49a8d,#776f65);
      color:#f5eee6;
      border:1px solid rgba(46,38,31,.35);
      box-shadow:inset 0 1px 2px rgba(255,255,255,.2),0 5px 10px rgba(0,0,0,.15);
      font-size:11px;
      letter-spacing:.16em;
      font-weight:900;
    }

    .box-lid{
      position:absolute;
      left:50%;
      top:15px;
      width:86%;
      height:125px;
      transform:translateX(-50%) rotateX(56deg);
      transform-origin:bottom center;
      border-radius:18px 18px 11px 11px;
      background:
        repeating-linear-gradient(
          6deg,
          rgba(255,255,255,.028) 0 10px,
          rgba(57,27,14,.04) 11px 13px,
          transparent 14px 28px
        ),
        linear-gradient(145deg,#a57451,#754b31);
      border:3px solid rgba(67,34,18,.35);
      box-shadow:0 18px 28px rgba(46,22,10,.22);
    }

    .box-lid::after{
      content:"";
      position:absolute;
      inset:14px;
      border:1px solid rgba(61,31,17,.24);
      border-radius:11px;
      box-shadow:inset 0 0 0 1px rgba(255,255,255,.035);
    }

    .inside-dark{
      position:absolute;
      left:50%;
      bottom:181px;
      width:62%;
      height:35px;
      transform:translateX(-50%);
      border-radius:50%;
      background:rgba(45,22,11,.5);
      filter:blur(1px);
      z-index:-1;
    }

    .paper-stack{
      position:absolute;
      left:50%;
      bottom:186px;
      width:210px;
      height:85px;
      transform:translateX(-50%);
      z-index:-1;
    }

    .paper-stack span{
      position:absolute;
      left:50%;
      bottom:0;
      width:128px;
      height:88px;
      border-radius:5px 5px 10px 5px;
      box-shadow:0 8px 15px rgba(0,0,0,.08);
    }

    .paper-stack span:nth-child(1){
      background:var(--paper-1);
      transform:translateX(-62%) rotate(-7deg);
    }

    .paper-stack span:nth-child(2){
      background:var(--paper-3);
      transform:translateX(-35%) rotate(5deg);
    }

    .paper-stack span:nth-child(3){
      background:var(--paper-5);
      transform:translateX(-50%) rotate(-1deg);
    }

    /* =========================================================
       SCATTERED NOTES
    ========================================================= */

    .note{
      position:absolute;
      width:148px;
      min-height:108px;
      padding:15px 14px 13px;
      border:0;
      border-radius:4px 4px 12px 4px;
      color:#494038;
      text-align:left;
      font-family:"Segoe Print","Comic Sans MS",cursive;
      font-size:13px;
      line-height:1.25;
      box-shadow:
        0 13px 21px rgba(39,21,12,.22),
        inset 0 1px 0 rgba(255,255,255,.45);
      display:flex;
      flex-direction:column;
      justify-content:space-between;
      gap:10px;
      transition:transform .26s ease,box-shadow .26s ease,filter .26s ease;
      z-index:6;
    }

    .note::before{
      content:"";
      position:absolute;
      inset:0;
      border-radius:inherit;
      background:
        repeating-linear-gradient(
          180deg,
          transparent 0 23px,
          rgba(85,72,59,.055) 24px 25px
        );
      pointer-events:none;
    }

    .note::after{
      content:"";
      position:absolute;
      right:8px;
      top:7px;
      width:24px;
      height:7px;
      border-radius:2px;
      background:rgba(120,108,94,.18);
      transform:rotate(2deg);
    }

    .note:hover{
      transform:translateY(-8px) rotate(0deg) scale(1.04)!important;
      box-shadow:0 20px 30px rgba(38,20,11,.28);
      z-index:20;
    }

    .note .status{
      position:relative;
      z-index:2;
      font-family:Inter,system-ui,sans-serif;
      font-size:9px;
      font-weight:900;
      letter-spacing:.09em;
      text-transform:uppercase;
      color:rgba(74,63,52,.58);
    }

    .note .label{
      position:relative;
      z-index:2;
      font-weight:700;
      font-size:14px;
    }

    .note.opened{
      filter:saturate(.78) brightness(.98);
      opacity:.82;
    }

    .note.opened .status{
      color:#5c694e;
    }

    .n1{left:1%;top:10%;background:var(--paper-1);transform:rotate(-9deg)}
    .n2{right:2%;top:13%;background:var(--paper-3);transform:rotate(8deg)}
    .n3{left:4%;bottom:10%;background:var(--paper-5);transform:rotate(6deg)}
    .n4{right:3%;bottom:9%;background:var(--paper-2);transform:rotate(-7deg)}
    .n5{left:18%;top:0;background:var(--paper-4);transform:rotate(4deg)}
    .n6{right:19%;top:1%;background:var(--paper-1);transform:rotate(-5deg)}
    .n7{left:20%;bottom:0;background:var(--paper-3);transform:rotate(-4deg)}
    .n8{right:20%;bottom:1%;background:var(--paper-4);transform:rotate(5deg)}
    .n9{left:37%;top:2%;background:var(--paper-5);transform:rotate(-2deg)}
    .n10{right:37%;bottom:0;background:var(--paper-2);transform:rotate(3deg)}

    .desk-prop{
      position:absolute;
      pointer-events:none;
      opacity:.9;
      z-index:3;
    }

    .cup{
      right:4%;
      top:39%;
      width:86px;
      height:86px;
      border-radius:50%;
      background:
        radial-gradient(circle at 50% 50%,#3b271b 0 31%,#d8cab7 33% 39%,#eee5d9 40% 66%,#cbbcab 67%);
      box-shadow:0 10px 18px rgba(35,18,10,.2);
    }

    .cup::after{
      content:"";
      position:absolute;
      right:-18px;
      top:28px;
      width:31px;
      height:28px;
      border:8px solid #d8cab7;
      border-left:0;
      border-radius:0 18px 18px 0;
    }

    .pencil{
      left:7%;
      top:46%;
      width:160px;
      height:12px;
      border-radius:999px;
      background:linear-gradient(180deg,#d5a94f,#b8812d);
      transform:rotate(17deg);
      box-shadow:0 5px 8px rgba(45,24,13,.18);
    }

    .pencil::before{
      content:"";
      position:absolute;
      left:-18px;
      top:0;
      border-top:6px solid transparent;
      border-bottom:6px solid transparent;
      border-right:19px solid #e0c29d;
    }

    .pencil::after{
      content:"";
      position:absolute;
      right:-12px;
      top:0;
      width:18px;
      height:12px;
      border-radius:0 6px 6px 0;
      background:#8d785f;
    }

    .hint{
      position:absolute;
      left:50%;
      bottom:10px;
      transform:translateX(-50%);
      z-index:30;
      padding:8px 12px;
      border-radius:999px;
      background:rgba(42,31,23,.72);
      border:1px solid rgba(255,255,255,.1);
      color:rgba(255,248,239,.9);
      font-size:11px;
      font-weight:800;
      white-space:nowrap;
      backdrop-filter:blur(8px);
    }

    .reset{
      display:block;
      margin:18px auto 0;
      border:0;
      background:transparent;
      color:rgba(255,248,239,.64);
      text-decoration:underline;
      font-size:11px;
    }

    /* =========================================================
       NOTE MODAL
    ========================================================= */

    .modal{
      position:fixed;
      inset:0;
      z-index:100;
      display:none;
      place-items:center;
      padding:20px;
      background:rgba(24,17,12,.58);
      backdrop-filter:blur(8px);
      -webkit-backdrop-filter:blur(8px);
    }

    .modal.open{
      display:grid;
      animation:fadeIn .2s ease;
    }

    @keyframes fadeIn{
      from{opacity:0}
      to{opacity:1}
    }

    .modal-card{
      position:relative;
      width:min(520px,94vw);
      min-height:350px;
      padding:36px 34px 32px 58px;
      border-radius:7px 7px 18px 7px;
      background:
        repeating-linear-gradient(
          180deg,
          transparent 0 30px,
          rgba(88,79,68,.07) 31px 32px
        ),
        linear-gradient(180deg,#fbf3d3,#f3e9c7);
      border:1px solid rgba(108,89,67,.22);
      box-shadow:0 34px 100px rgba(18,10,5,.42);
      transform:rotate(-.5deg);
      animation:noteOpen .32s cubic-bezier(.2,.8,.2,1);
      overflow:hidden;
    }

    .modal-card::before{
      content:"";
      position:absolute;
      left:42px;
      top:0;
      bottom:0;
      width:1px;
      background:rgba(161,84,72,.19);
    }

    .modal-card::after{
      content:"";
      position:absolute;
      right:-38px;
      bottom:-38px;
      width:100px;
      height:100px;
      border-radius:50%;
      background:rgba(255,255,255,.22);
    }

    @keyframes noteOpen{
      from{opacity:0;transform:translateY(16px) scale(.94) rotate(-3deg)}
      to{opacity:1;transform:rotate(-.5deg)}
    }

    .modal-content{
      position:relative;
      z-index:2;
    }

    .modal-icon{
      width:52px;
      height:52px;
      display:grid;
      place-items:center;
      border-radius:50%;
      background:#ebe0bc;
      border:1px solid rgba(87,72,57,.18);
      box-shadow:inset 0 2px 3px rgba(255,255,255,.5);
      font-size:24px;
      margin-bottom:16px;
    }

    .modal-kicker{
      margin:0 0 8px;
      color:#776959;
      font-size:10px;
      font-weight:900;
      letter-spacing:.12em;
      text-transform:uppercase;
    }

    .modal-card h2{
      margin:0;
      font-family:Georgia,"Times New Roman",serif;
      font-size:clamp(28px,5vw,40px);
      font-weight:600;
      letter-spacing:-.035em;
      color:#433930;
    }

    .message{
      margin:24px 0 0;
      color:#54483e;
      font-family:Georgia,"Times New Roman",serif;
      font-size:clamp(18px,3vw,24px);
      line-height:1.65;
      white-space:pre-line;
    }

    .close-btn{
      margin-top:28px;
      min-height:46px;
      padding:0 17px;
      border:1px solid rgba(74,55,39,.18);
      border-radius:10px;
      color:#f8f1e8;
      background:linear-gradient(180deg,#6d4a34,#4c3324);
      box-shadow:0 10px 20px rgba(42,23,12,.2);
      font-weight:900;
      transition:.22s ease;
    }

    .close-btn:hover{
      transform:translateY(-2px);
      background:linear-gradient(180deg,#78533b,#543827);
    }

    /* =========================================================
       RESPONSIVE
    ========================================================= */

    @media(max-width:950px){
      .desk{
        height:760px;
      }

      .box-wrap{
        top:51%;
        width:440px;
      }

      .n1{left:2%;top:8%}
      .n2{right:2%;top:9%}
      .n3{left:3%;bottom:8%}
      .n4{right:3%;bottom:8%}
      .n5{left:14%;top:25%}
      .n6{right:14%;top:25%}
      .n7{left:14%;bottom:24%}
      .n8{right:14%;bottom:23%}
      .n9{left:37%;top:4%}
      .n10{right:37%;bottom:2%}

      .cup{right:1%;top:44%}
      .pencil{left:3%;top:46%}
    }

    @media(max-width:680px){
      .table{
        padding:82px 8px 24px;
      }

      .back-btn{
        top:10px;
        left:10px;
        right:10px;
        width:calc(100% - 20px);
      }

      .header{
        margin-bottom:16px;
      }

      .desk{
        width:100%;
        height:920px;
      }

      .box-wrap{
        top:50%;
        width:min(94vw,420px);
        height:300px;
      }

      .box-body{
        width:82%;
        height:165px;
      }

      .box-lid{
        width:90%;
      }

      .note{
        width:118px;
        min-height:92px;
        padding:12px 11px 11px;
        font-size:11px;
      }

      .note .label{
        font-size:12px;
      }

      .n1{left:2%;top:5%}
      .n2{right:2%;top:6%}
      .n3{left:2%;bottom:5%}
      .n4{right:2%;bottom:5%}

      .n5{left:4%;top:26%}
      .n6{right:4%;top:27%}
      .n7{left:4%;bottom:26%}
      .n8{right:4%;bottom:26%}

      .n9{left:34%;top:15%}
      .n10{right:34%;bottom:15%}

      .cup{
        width:66px;
        height:66px;
        top:41%;
        right:1%;
        opacity:.72;
      }

      .cup::after{
        right:-13px;
        top:22px;
        width:24px;
        height:21px;
        border-width:6px;
      }

      .pencil{
        width:110px;
        left:0;
        top:43%;
        opacity:.76;
      }

      .hint{
        max-width:86%;
        white-space:normal;
        text-align:center;
      }

      .modal-card{
        padding:30px 20px 26px 48px;
      }

      .modal-card::before{
        left:34px;
      }
    }

    @media(max-width:420px){
      .desk{
        height:980px;
      }

      .note{
        width:108px;
      }

      .n9{left:32%}
      .n10{right:32%}
    }

    @media(prefers-reduced-motion:reduce){
      *,*::before,*::after{
        animation-duration:.001ms!important;
        animation-iteration-count:1!important;
        transition-duration:.001ms!important;
      }
    }
  </style>
</head>

<body>
  <div class="room">
    <div class="wall"></div>
    <div class="window-light"></div>
    <div class="window-bars"></div>
    <div class="stars" id="sparkles"></div>

    <a class="back-btn" href="regalo21.html">← Volver a los regalos</a>

    <main class="table">
      <section class="header">
        <div class="kicker">✉️ Regalo 04</div>

        <h1>La cajita de las notitas</h1>

        <p>
          Una cajita sobre la mesa, algunas notitas alrededor y pequeñas palabras
          esperando a que las abras.
        </p>

        <div class="counter">
          <span>Abiertas:</span>
          <strong id="counterText">0 / 71</strong>
        </div>
      </section>

      <section class="desk" id="notesScene">
        <div class="desk-prop cup"></div>
        <div class="desk-prop pencil"></div>

        <div class="box-wrap">
          <div class="box-floor-shadow"></div>
          <div class="box-lid"></div>
          <div class="inside-dark"></div>

          <div class="paper-stack">
            <span></span>
            <span></span>
            <span></span>
          </div>

          <div class="box-body">
            <div class="label-plate">NOTITAS</div>
          </div>
        </div>

        <div class="hint">Tocá una notita para leerla ✉️</div>
      </section>

      <button class="reset" id="resetBtn">
        Marcar todas como cerradas
      </button>
    </main>
  </div>

  <div class="modal" id="noteModal" role="dialog" aria-modal="true" aria-labelledby="noteTitle">
    <div class="modal-card">
      <div class="modal-content">
        <div class="modal-icon">✉️</div>
        <p class="modal-kicker">Una notita para vos</p>
        <h2 id="noteTitle">Pequeño recordatorio</h2>
        <div class="message" id="noteMessage"></div>
        <button class="close-btn" id="closeBtn">Cerrar notita</button>
      </div>
    </div>
  </div>

  <script>
    /*
      ==========================================================
      ✨ NOTITAS PARA KEYSSI ✨
      ==========================================================

      Hay 71 notitas en total.
      La página las mezcla automáticamente para que no tengan
      un orden fijo. Solo se muestran hasta 10 papelitos a la vez
      para conservar la composición de la cajita sin amontonarlos.
      Cuando se cierra una notita leída, aparece otra distinta.
      ==========================================================
    */

    const NOTAS = [
      "Sigue siendo esa persona que hace bonito hasta un momento completamente normal.",
      "Eres una persona increíble, y espero que nunca se te olvide.",
      "Que nunca te falten razones para sonreír.",
      "Ojalá la vida siempre encuentre maneras de hacerte feliz.",
      "Nunca dudes de lo mucho que vales.",
      "Espero que siempre encuentres algo que te haga ilusión.",
      "Que nunca pierdas esa forma tan tuya de ver las cosas.",
      "Hay personas que dejan recuerdos; tú dejaste mucho más que eso.",
      "Ojalá algún día puedas verte con los mismos ojos bonitos con los que te ven quienes te quieren.",
      "Que siempre tengas motivos para sentirte orgullosa de ti.",
      "Nunca dejes de ser esa persona tan especial que eres.",
      "Espero que la vida te devuelva toda la felicidad que mereces.",
      "Hay personas difíciles de olvidar, y tú eres una de ellas.",
      "Gracias por haber sido parte de momentos que todavía guardo con cariño.",
      "Algunos recuerdos simplemente se quedan, aunque pase el tiempo.",
      "Ojalá sigas coleccionando momentos que algún día recuerdes con una sonrisa.",
      "Que siempre encuentres un poquito de paz incluso en los días difíciles.",
      "Espero que cumplas cada una de esas cosas que alguna vez soñaste.",
      "Nunca sabes cuánto bien puedes hacerle a alguien simplemente siendo tú.",
      "Sigue brillando, incluso cuando no te des cuenta de que lo estás haciendo.",
      "Que la vida te sorprenda de las maneras más bonitas.",
      "Ojalá nunca olvides lo especial que eres para algunas personas.",
      "Hay sonrisas que uno recuerda incluso después de mucho tiempo.",
      "Espero que sigas encontrando atardeceres que te hagan detenerte un momento.",
      "Que nunca te falten personas con quienes compartir tus días buenos y malos.",
      "Ojalá siempre tengas un lugar donde puedas sentirte tranquila.",
      "Si algún día dudas de ti, recuerda todo lo que has sido capaz de superar.",
      "Que tus próximos capítulos estén llenos de cosas bonitas.",
      "Espero que sigas creciendo sin dejar atrás esa parte de ti que te hace ser tú.",
      "Algunas personas llegan a nuestra vida y, de alguna manera, se quedan.",
      "Aunque pasen los años, hay recuerdos que uno guarda con especial cariño.",
      "Ojalá algún día recuerdes todo lo bonito que vivimos y sonrías.",
      "Gracias por haberme regalado recuerdos que todavía significan mucho para mí.",
      "Hay momentos pequeños que terminan significando muchísimo.",
      "Nunca pensé que alguien pudiera convertirse en un recuerdo tan bonito.",
      "Espero que siempre encuentres motivos para mirar hacia adelante.",
      "Que seas muy feliz, incluso en los días en los que todo parezca complicado.",
      "Si alguna vez necesitas recordar que eres importante, espero que esta notita te lo recuerde.",
      "No cambies para encajar en ningún lugar; sigue siendo tú.",
      "Ojalá la vida te cuide muchísimo.",
      "Que nunca te falte alguien que te recuerde lo maravillosa que eres.",
      "Hay personas que uno conoce una vez y termina recordando durante mucho tiempo.",
      "Espero que algún día todo lo que deseas encuentre la forma de llegar a ti.",
      "Sigue siendo mi bonita, aunque sea solamente en algún pequeño rincón de mis recuerdos.",
      "Y si algún día te preguntas si fuiste importante para alguien, la respuesta siempre será sí.",
      "Te quiero muchísimoooo, nunca lo olvides. ❤️",
      "Te adoroooo, bonita.",
      "Un brownie pa tiii 🍫",
      "Te mando un abracito porque sí. 🫂",
      "Espero que hoy hayas sonreído mucho.",
      "Te mereces un chocolatito. 🍫",
      "Solo paso a decirte que te quiero mucho. 🫶",
      "Bonita, nunca olvides lo especial que eres.",
      "Te quiero, te quiero y te quiero. Ya.?",
      "Un Monster imaginario pa ti. 🧃",
      "Te mando buenas vibras ✨",
      "Sonríe, bonita.",
      "No sé qué decir, así que: te adoro. JAJA.",
      "Un abrazo de esos que duran mucho. 🫂",
      "Porque sí: te quiero muchísimo.",
      "Cuídate mucho, ¿sí?",
      "Espero que estés bien, de verdad.",
      "Un poquito de cariño para ti. 💗",
      "Para que no digas que no pienso en ti. JAJA.",
      "Esto me hizo pensar en ti. 👀",
      "Vi un termometro y dije: “esto es muy de mi bonita”.",
      "Espero que esto te saque aunque sea una pequeña sonrisa.",
      "Porque tú mereces detallitos bonitos.",
      "Te quiero más de lo que digo.",
      "No te olvides de sonreír hoy.",
      "Te amo."
];

    const NOTE_COLORS = [
      "var(--paper-1)",
      "var(--paper-3)",
      "var(--paper-5)",
      "var(--paper-2)",
      "var(--paper-4)"
    ];

    const POSITIONS = [
      "n1","n2","n3","n4","n5",
      "n6","n7","n8","n9","n10"
    ];

    const STORAGE_KEY = "notitas-keyssi-realistas-v2";
    const MAX_VISIBLE = POSITIONS.length;

    const scene = document.getElementById("notesScene");
    const modal = document.getElementById("noteModal");
    const noteMessage = document.getElementById("noteMessage");
    const closeBtn = document.getElementById("closeBtn");
    const counterText = document.getElementById("counterText");
    const resetBtn = document.getElementById("resetBtn");

    let savedOpened = [];

    try {
      savedOpened = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
    } catch (_) {
      savedOpened = [];
    }

    let opened = new Set(
      savedOpened
        .map(Number)
        .filter(index => Number.isInteger(index) && index >= 0 && index < NOTAS.length)
    );

    let queue = [];
    let currentButton = null;
    let currentIndex = null;

    function shuffle(items) {
      const copy = [...items];

      for(let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }

      return copy;
    }

    function getVisibleIndexes() {
      return new Set(
        [...scene.querySelectorAll(".note")]
          .map(note => Number(note.dataset.index))
          .filter(Number.isInteger)
      );
    }

    function refillQueue() {
      const visible = getVisibleIndexes();

      queue = shuffle(
        NOTAS
          .map((_, index) => index)
          .filter(index => !opened.has(index) && !visible.has(index))
      );
    }

    function getNextIndex() {
      while(queue.length) {
        const next = queue.shift();
        const visible = getVisibleIndexes();

        if(!opened.has(next) && !visible.has(next)) {
          return next;
        }
      }

      refillQueue();
      return queue.shift() ?? null;
    }

    function renderButton(button, index) {
      const isOpen = opened.has(index);

      button.classList.toggle("opened", isOpen);

      button.innerHTML = `
        <span class="status">${isOpen ? "✓ Abierta" : "✉ Cerrada"}</span>
        <span class="label">${isOpen ? "Leer otra vez" : "Abrir una notita"}</span>
      `;
    }

    function configureButton(button, index, slot) {
      button.className = `note ${POSITIONS[slot]}`;
      button.style.background = NOTE_COLORS[index % NOTE_COLORS.length];
      button.dataset.index = index;
      button.dataset.slot = slot;
      button.setAttribute("aria-label", `Abrir notita ${index + 1}`);

      renderButton(button, index);
    }

    function createNoteButton(index, slot) {
      const button = document.createElement("button");
      button.type = "button";

      configureButton(button, index, slot);

      button.addEventListener("click", () => {
        openNote(Number(button.dataset.index), button);
      });

      scene.appendChild(button);
    }

    function createNotes() {
      scene.querySelectorAll(".note").forEach(note => note.remove());

      queue = shuffle(
        NOTAS
          .map((_, index) => index)
          .filter(index => !opened.has(index))
      );

      /* Si ya se leyeron todas, dejamos algunas disponibles para releer. */
      if(queue.length === 0) {
        const reread = shuffle(NOTAS.map((_, index) => index));

        reread
          .slice(0, MAX_VISIBLE)
          .forEach((index, slot) => createNoteButton(index, slot));
      } else {
        const visibleCount = Math.min(MAX_VISIBLE, queue.length);

        for(let slot = 0; slot < visibleCount; slot++) {
          const index = queue.shift();
          createNoteButton(index, slot);
        }
      }

      updateCounter();
    }

    function openNote(index, button) {
      if(!Number.isInteger(index) || index < 0 || index >= NOTAS.length) return;

      noteMessage.textContent = NOTAS[index];

      opened.add(index);
      localStorage.setItem(STORAGE_KEY, JSON.stringify([...opened]));

      renderButton(button, index);
      updateCounter();

      currentButton = button;
      currentIndex = index;

      modal.classList.add("open");
      document.body.style.overflow = "hidden";
      closeBtn.focus();
    }

    function replaceReadNote() {
      if(!currentButton || currentIndex === null) return;

      const slot = Number(currentButton.dataset.slot);
      const nextIndex = getNextIndex();

      if(nextIndex !== null) {
        configureButton(currentButton, nextIndex, slot);
      } else {
        renderButton(currentButton, currentIndex);
      }

      currentButton = null;
      currentIndex = null;
    }

    function closeModal() {
      modal.classList.remove("open");
      document.body.style.overflow = "";

      replaceReadNote();
    }

    function updateCounter() {
      counterText.textContent = `${opened.size} / ${NOTAS.length}`;
    }

    closeBtn.addEventListener("click", closeModal);

    modal.addEventListener("click", event => {
      if(event.target === modal) {
        closeModal();
      }
    });

    document.addEventListener("keydown", event => {
      if(event.key === "Escape" && modal.classList.contains("open")) {
        closeModal();
      }
    });

    resetBtn.addEventListener("click", () => {
      opened.clear();
      localStorage.removeItem(STORAGE_KEY);
      currentButton = null;
      currentIndex = null;
      createNotes();
    });

    createNotes();
  </script>
</body>
</html>
